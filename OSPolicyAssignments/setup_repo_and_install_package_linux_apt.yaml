## NOTE: This provides PoC demo environment for various use cases ##
##  This is not built for production workload ##

# An OS policy assignment to set up the Google Cloud Monitoring repository and
# install the Stackdriver agent for VMs running Debian and Ubuntu OSes.
osPolicies:
  - id: setup-repo-and-install-package-policy
    mode: ENFORCEMENT
    resourceGroups:
      - inventoryFilters:
          - osShortName: debian
        resources:
          - id: setup-repo
            repository:
              apt:
                archiveType: DEB
                uri: https://packages.cloud.google.com/apt
                distribution: google-cloud-monitoring-buster-all
                components:
                  - main
                gpgKey: https://packages.cloud.google.com/apt/doc/apt-key.gpg
          - id: install-pkg
            pkg:
              desiredState: INSTALLED
              apt:
                name: stackdriver-agent
      - inventoryFilters:
          - osShortName: ubuntu
        resources:
          - id: setup-repo
            repository:
              apt:
                archiveType: DEB
                uri: https://packages.cloud.google.com/apt
                distribution: google-cloud-monitoring-groovy
                components:
                  - main
                gpgKey: https://packages.cloud.google.com/apt/doc/apt-key.gpg
          - id: install-pkg
            pkg:
              desiredState: INSTALLED
              apt:
                name: stackdriver-agent
instanceFilter:
  inventories:
    - osShortName: debian
    - osShortName: ubuntu
rollout:
  disruptionBudget:
    fixed: 10
  minWaitDuration: 300s
